[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fintech-trading-research"
version = "0.1.0"
description = "Educational backtesting and paper-trading research tools"
requires-python = ">=3.11"
dependencies = ["scikit-learn>=1.5,<2", "upstox-python-sdk>=2.23,<3", "websocket-client>=1.8,<2", "certifi>=2024.7.4"]

[tool.setuptools.packages.find]
where = ["src"]
